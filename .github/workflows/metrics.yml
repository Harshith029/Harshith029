name: Generate Metrics

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # Main card: profile header, repo totals, isometric contribution calendar
      - name: Overview
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: Harshith029
          filename: assets/metrics.svg
          committer_branch: main
          committer_message: "chore: refresh metrics [skip ci]"
          base: header, repositories
          config_timezone: Asia/Kolkata
          config_theme: dark
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          extras_css: |
            svg, .background { fill: #0d1117 !important; background: #0d1117 !important; }
            h2, .title, .primary { color: #00ff41 !important; fill: #00ff41 !important; }
            .value, .key, text { color: #9be8a8 !important; }
            svg { border: none !important; }

      # Language breakdown, weighted by recent commits
      - name: Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: Harshith029
          filename: assets/metrics-langs.svg
          committer_branch: main
          committer_message: "chore: refresh language metrics [skip ci]"
          base: ""
          config_timezone: Asia/Kolkata
          config_theme: dark
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          extras_css: |
            svg, .background { fill: #0d1117 !important; background: #0d1117 !important; }
            h2, .title, .primary { color: #00ff41 !important; fill: #00ff41 !important; }
            .value, .key, text { color: #9be8a8 !important; }
            svg { border: none !important; }
