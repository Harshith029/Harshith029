<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28" role="img" aria-label="online indicator">
  <defs>
    <filter id="pg" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="14" cy="14" r="5" fill="#00ff41" opacity="0.35">
    <animate attributeName="r" values="5;12;5" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.45;0;0.45" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="14" cy="14" r="11" fill="none" stroke="#00ff41" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.7">
    <animateTransform attributeName="transform" type="rotate" values="0 14 14;360 14 14" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="14" cy="14" r="5" fill="#00ff41" filter="url(#pg)">
    <animate attributeName="opacity" values="1;0.55;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
</svg>
