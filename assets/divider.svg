<svg xmlns="http://www.w3.org/2000/svg" width="900" height="8" viewBox="0 0 900 8" role="img" aria-label="divider">
  <defs>
    <linearGradient id="dg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ff41" stop-opacity="0"/>
      <stop offset="18%" stop-color="#00ff41" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#00ff41" stop-opacity="0.95"/>
      <stop offset="82%" stop-color="#00ff41" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#00ff41" stop-opacity="0"/>
    </linearGradient>
    <filter id="dgl" x="-50%" y="-400%" width="200%" height="900%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="0" y="3" width="900" height="2" fill="url(#dg)" filter="url(#dgl)"/>
  <circle cy="4" r="3" fill="#d7ffe4" filter="url(#dgl)">
    <animate attributeName="cx" values="0;900;0" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="6s" repeatCount="indefinite"/>
  </circle>
</svg>
