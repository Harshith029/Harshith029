<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360" role="img" aria-label="Arc reactor">
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="38%" stop-color="#d7f8ff"/>
      <stop offset="70%" stop-color="#00d9ff"/>
      <stop offset="100%" stop-color="#0077a8" stop-opacity="0.35"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00d9ff" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#00d9ff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#00d9ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="rglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="rsoft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <circle cx="180" cy="180" r="178" fill="url(#halo)">
    <animate attributeName="opacity" values="0.65;1;0.65" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- outer HUD ticks, matrix green, slow counter-rotation -->
  <g stroke="#00ff41" stroke-width="2" opacity="0.55" filter="url(#rsoft)">
    <animateTransform attributeName="transform" type="rotate" values="360 180 180;0 180 180" dur="26s" repeatCount="indefinite"/>
    <circle cx="180" cy="180" r="168" fill="none" stroke-width="1" stroke-dasharray="3 9" opacity="0.6"/>
    <path d="M180 8 L180 26"/><path d="M352 180 L334 180"/><path d="M180 352 L180 334"/><path d="M8 180 L26 180"/>
    <path d="M301 59 L290 70"/><path d="M301 301 L290 290"/><path d="M59 301 L70 290"/><path d="M59 59 L70 70"/>
  </g>

  <!-- rotating dashed containment ring -->
  <g fill="none" stroke="#00d9ff" filter="url(#rsoft)">
    <animateTransform attributeName="transform" type="rotate" values="0 180 180;360 180 180" dur="14s" repeatCount="indefinite"/>
    <circle cx="180" cy="180" r="146" stroke-width="4" stroke-dasharray="26 14" opacity="0.75"/>
    <circle cx="180" cy="180" r="132" stroke-width="1.5" stroke-dasharray="2 8" opacity="0.5"/>
  </g>

  <!-- static housing -->
  <circle cx="180" cy="180" r="120" fill="#050a0d" stroke="#123" stroke-width="2"/>
  <circle cx="180" cy="180" r="118" fill="none" stroke="#00d9ff" stroke-width="1.5" opacity="0.35"/>

  <!-- coil segments -->
  <g fill="#0a1418" stroke="#00d9ff" stroke-width="2" opacity="0.9">
    <circle cx="180" cy="82" r="11"/><circle cx="237" cy="99" r="11"/><circle cx="272" cy="147" r="11"/>
    <circle cx="272" cy="213" r="11"/><circle cx="237" cy="261" r="11"/><circle cx="180" cy="278" r="11"/>
    <circle cx="123" cy="261" r="11"/><circle cx="88" cy="213" r="11"/><circle cx="88" cy="147" r="11"/>
    <circle cx="123" cy="99" r="11"/>
    <animate attributeName="opacity" values="0.9;0.45;0.9" dur="2.6s" repeatCount="indefinite"/>
  </g>

  <!-- iconic triangle reactor plate -->
  <path d="M180 88 A 150 150 0 0 1 259.7 226 A 150 150 0 0 1 100.3 226 A 150 150 0 0 1 180 88 Z"
        fill="none" stroke="#7ff0ff" stroke-width="9" stroke-linejoin="round" filter="url(#rglow)">
    <animate attributeName="opacity" values="0.85;1;0.85" dur="2.2s" repeatCount="indefinite"/>
  </path>
  <path d="M180 88 A 150 150 0 0 1 259.7 226 A 150 150 0 0 1 100.3 226 A 150 150 0 0 1 180 88 Z"
        fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round" opacity="0.9"/>

  <!-- core -->
  <circle cx="180" cy="180" r="54" fill="url(#core)" filter="url(#rglow)">
    <animate attributeName="r" values="54;58;54" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="180" cy="180" r="30" fill="#ffffff" opacity="0.95">
    <animate attributeName="opacity" values="0.95;0.6;0.95" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="180" cy="180" r="66" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.35"/>
</svg>
